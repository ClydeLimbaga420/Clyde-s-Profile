
<div style="font-family: system-ui, sans-serif, Arial; font-size: 12px;">

    <div>
        <strong>{{from_name}}</strong> sent you a message!
    </div>

    <div style="margin-top: 20px; padding: 15px 0; border-width: 1px 0; border-style: dashed; border-color: lightgrey;">

        <table role="presentation">
            <tbody>

                <!-- Sender -->
                <tr>
                    <td style="vertical-align: top;">
                        <div style="padding: 6px 10px; margin: 0 10px; background-color: aliceblue; border-radius: 5px; font-size: 26px;" role="img">
                            👤
                        </div>
                    </td>

                    <td style="vertical-align: top;">
                        <div style="color: #2c3e50; font-size: 16px;">
                            <strong>{{name}}</strong>
                        </div>

                        <div style="color: #666666; font-size: 13px;">
                            {{reply_to}}
                        </div>

                        <div style="color: #999999; font-size: 12px; margin-top: 4px;">
                            {{time}}
                        </div>
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td></td>

                    <td style="padding-top: 15px;">
                        <p style="font-size: 16px; margin: 0;">
                            {{message}}
                        </p>
                    </td>
                </tr>

            </tbody>
        </table>

    </div>

</div>
```
